<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CardioCheck AI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <nav class="navbar">
        <div class="logo">❤️ Cardio Care.<span>AI</span></div>
    </nav>

    <div class="hero-section">
        <h1 style="color: #f9f7f7;">❤️Heart Disease Prediction Portal</h1>
        <p style="color: #f9f7f7;">Enter clinical data to receive an instant AI-powered health assessment.</p>
    </div>

    <div class="main-container">
        <form id="predictionForm" action="/predict" method="POST">
            <div class="form-grid">
                <div class="input-box"><label>Age</label><input type="number" name="age" required></div>
                <div class="input-box"><label>Sex</label><select name="sex"><option value="1">Male</option><option value="0">Female</option></select></div>
                <div class="input-box"><label>Chest Pain (0-3)</label><input type="number" name="cp" min="0" max="3" required></div>
                <div class="input-box"><label>Resting BP</label><input type="number" name="trestbps" required></div>
                <div class="input-box"><label>Cholesterol</label><input type="number" name="chol" required></div>
                <div class="input-box"><label>Fasting Sugar</label><select name="fbs"><option value="0">Normal</option><option value="1">>120mg/dl</option></select></div>
                <div class="input-box"><label>ECG (0-2)</label><input type="number" name="restecg" required></div>
                <div class="input-box"><label>Max Heart Rate</label><input type="number" name="thalach" required></div>
                <div class="input-box"><label>Exercise Angina</label><select name="exang"><option value="0">No</option><option value="1">Yes</option></select></div>
                <div class="input-box"><label>Oldpeak</label><input type="number" step="0.1" name="oldpeak" required></div>
                <div class="input-box"><label>Slope (0-2)</label><input type="number" name="slope" required></div>
                <div class="input-box"><label>Major Vessels</label><input type="number" name="ca" required></div>
                <div class="input-box"><label>Thalassemia</label><input type="number" name="thal" required></div>
            </div>
            <button type="submit" class="btn-predict">Analyze Health Data</button>
        </form>

        <div id="result" class="result-section {% if prediction_text %}show{% endif %} {{ res_class }}">
            {{ prediction_text }}
        </div>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
